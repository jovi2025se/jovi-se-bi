// Aggregate Meta_M0 targets by city
function buildTargetByCity() {
  const map = {};
  for (const row of META_M0_RAW) {
    const city = row[0];
    const total = row[1]+row[2]+row[3]+row[4]+row[5]+row[6]+row[7]+row[8]+row[9]+row[10]+row[11]+row[12];
    map[city] = (map[city] || 0) + total;
  }
  return map;
}

// Color logic
function achColor(pct) {
  if (pct >= 1.0) return '#415FFF';
  if (pct >= 0.8) return '#1d9e75';
  if (pct >= 0.6) return '#ef9f27';
  return '#e24b4a';
}

// Bubble radius scaling
function bubbleRadius(sales, maxSales) {
  if (!sales || maxSales === 0) return 4;
  const minR = 6, maxR = 40;
  return minR + (sales / maxSales) * (maxR - minR);
}

// Initialize map
const map = L.map('map', {
  center: [-20.5, -43.5],
  zoom: 7,
  zoomControl: true,
  attributionControl: false
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 18
}).addTo(map);

// Fetch and process data
async function loadData() {
  const status = document.getElementById('status');
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID_VENDAS}`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();

    // Parse CSV
    const lines = text.trim().split('\n');
    const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,''));
    const rows = lines.slice(1).map(line => {
      const cols = [];
      let inQ = false, cur = '';
      for (const ch of line) {
        if (ch === '"') { inQ = !inQ; }
        else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
        else cur += ch;
      }
      cols.push(cur.trim());
      return cols;
    });

    const idx = {};
    headers.forEach((h,i) => idx[h] = i);

    // Find column indices
    const cidadeIdx = idx['CIDADE'] ?? idx['cidade'] ?? -1;
    const dateIdx   = idx['DATA_VENDA'] ?? idx['data_venda'] ?? -1;
    const imeiIdx   = idx['IMEI'] ?? idx['imei'] ?? -1;

    if (cidadeIdx < 0 || dateIdx < 0 || imeiIdx < 0) {
      // Try to detect columns
      console.warn('Headers:', headers);
      throw new Error('Required columns not found: ' + headers.join(', '));
    }

    // D0 = today in BRT (UTC-3)
    const now = new Date(Date.now() - 3*3600*1000);
    const d0Year = now.getUTCFullYear();
    const d0Month = now.getUTCMonth() + 1;
    const d0Day = now.getUTCDate();
    const d0Str = `${d0Year}-${String(d0Month).padStart(2,'0')}-${String(d0Day).padStart(2,'0')}`;

    document.getElementById('d0-label').textContent = `D0: ${String(d0Day).padStart(2,'0')}/${String(d0Month).padStart(2,'0')}/${d0Year}`;

    // Peso acumulado até D0
    const pesoAcumulado = DIA_PESO.slice(1, d0Day+1).reduce((a,b) => a+b, 0);

    // Count distinct IMEIs by city for current month up to D0
    const salesByCity = {};
    const imeisSeen = {};

    for (const row of rows) {
      const rawDate = row[dateIdx] ? row[dateIdx].replace(/"/g,'').trim() : '';
      const imei    = row[imeiIdx] ? row[imeiIdx].replace(/"/g,'').trim() : '';
      const cidade  = row[cidadeIdx] ? row[cidadeIdx].replace(/"/g,'').trim() : '';

      if (!rawDate || !imei || !cidade) continue;

      // Parse date — handle DD/MM/YYYY or YYYY-MM-DD
      let y, m, d;
      if (rawDate.includes('/')) {
        const parts = rawDate.split('/');
        d = parseInt(parts[0]); m = parseInt(parts[1]); y = parseInt(parts[2]);
      } else {
        const parts = rawDate.split('-');
        y = parseInt(parts[0]); m = parseInt(parts[1]); d = parseInt(parts[2]);
      }

      if (y !== d0Year || m !== d0Month) continue;
      if (d > d0Day) continue;

      const key = `${imei}_${cidade}`;
      if (imeisSeen[key]) continue;
      imeisSeen[key] = true;
      salesByCity[cidade] = (salesByCity[cidade] || 0) + 1;
    }

    const targetByCity = buildTargetByCity();

    // Apply peso to targets
    const targetMTDByCity = {};
    for (const [city, rawTarget] of Object.entries(targetByCity)) {
      targetMTDByCity[city] = rawTarget * pesoAcumulado;
    }

    // Merge: only cities with coordinates
    const cityData = {};
    for (const city of Object.keys(COORDS)) {
      const sales = salesByCity[city] || 0;
      const target = targetMTDByCity[city] || 0;
      if (sales === 0 && target === 0) continue;
      cityData[city] = { sales, target };
    }

    const maxSales = Math.max(...Object.values(cityData).map(d => d.sales), 1);
    const totalSales = Object.values(cityData).reduce((a,b) => a + b.sales, 0);
    const totalTarget = Object.values(cityData).reduce((a,b) => a + b.target, 0);

    // Update KPIs
    document.getElementById('kpi-sales').textContent = totalSales.toLocaleString('pt-BR');
    document.getElementById('kpi-target').textContent = Math.round(totalTarget).toLocaleString('pt-BR');
    const overallAch = totalTarget > 0 ? totalSales / totalTarget : 0;
    document.getElementById('kpi-ach').textContent = (overallAch*100).toFixed(1) + '%';
    document.getElementById('kpi-ach').style.color = achColor(overallAch);

    // Plot bubbles
    for (const [city, { sales, target }] of Object.entries(cityData)) {
      const [lat, lng] = COORDS[city];
      const ach = target > 0 ? sales / target : 0;
      const color = achColor(ach);
      const radius = bubbleRadius(sales, maxSales);

      const circle = L.circleMarker([lat, lng], {
        radius,
        fillColor: color,
        color: '#0F1117',
        weight: 1.5,
        fillOpacity: 0.85
      }).addTo(map);

      const ttHtml = `
        <div class="tt-city">${city}</div>
        <div class="tt-row"><span>Sales MTD</span><span>${sales}</span></div>
        <div class="tt-row"><span>Target MTD</span><span>${Math.round(target)}</span></div>
        <div class="tt-ach" style="color:${color}">${(ach*100).toFixed(1)}% Ach</div>
      `;

      circle.bindTooltip(ttHtml, {
        className: 'city-tooltip',
        direction: 'top',
        offset: [0, -radius]
      });
    }

    status.style.display = 'none';

  } catch (err) {
    status.textContent = '⚠ ' + err.message;
    status.style.color = '#e24b4a';
    console.error(err);
  }
}

loadData();
// Auto-refresh every 30 min
setInterval(loadData, 30 * 60 * 1000);
</script>
